apiVersion: apps/v1
kind: Deployment
metadata:
  name: go-service
  namespace: urlshortener
  labels:
    app: go-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: go-service
  template:
    metadata:
      labels:
        app: go-service
    spec:
      containers:
        - name: go-service
          image: DOCKERHUB_USERNAME/go-service:latest
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: go-service-config
            - secretRef:
                name: go-service-secret
          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: go-data
              mountPath: /app/data
      volumes:
        - name: go-data
          emptyDir: {}
