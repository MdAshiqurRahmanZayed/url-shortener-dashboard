apiVersion: apps/v1
kind: Deployment
metadata:
  name: python-service
  namespace: urlshortener
  labels:
    app: python-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: python-service
  template:
    metadata:
      labels:
        app: python-service
    spec:
      containers:
        - name: python-service
          image: DOCKERHUB_USERNAME/python-service:latest
          ports:
            - containerPort: 5000
          envFrom:
            - configMapRef:
                name: python-service-config
            - secretRef:
                name: python-service-secret
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /
              port: 5000
            initialDelaySeconds: 20
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - name: python-data
              mountPath: /app/data
      volumes:
        - name: python-data
          emptyDir: {}
