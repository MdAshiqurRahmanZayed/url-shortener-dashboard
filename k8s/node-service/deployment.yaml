apiVersion: apps/v1
kind: Deployment
metadata:
  name: node-service
  namespace: urlshortener
  labels:
    app: node-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: node-service
  template:
    metadata:
      labels:
        app: node-service
    spec:
      containers:
        - name: node-service
          image: DOCKERHUB_USERNAME/node-service:latest
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: node-service-config
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: node-data
              mountPath: /app/data
      volumes:
        - name: node-data
          emptyDir: {}
