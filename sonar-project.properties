sonar.projectKey=<YOUR_PROJECT_KEY>
sonar.organization=<YOUR_SONAR_ORG>
sonar.projectName=URL Shortener Microservices

sonar.sources=python-service,go-service,node-service
sonar.exclusions=**/*.db,**/node_modules/**,**/.venv/**,**/venv/**,**/*.sum

# Python
sonar.python.version=3.11

# Coverage reports (optional — add tests to generate these)
# sonar.python.coverage.reportPaths=coverage.xml
# sonar.go.coverage.reportPaths=coverage.out

# Quality gate thresholds
sonar.qualitygate.wait=true
