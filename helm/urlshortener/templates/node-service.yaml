---
apiVersion: v1
kind: ConfigMap
metadata:
  name: node-service-config
  namespace: {{ .Values.global.namespace }}
data:
  PORT: "{{ .Values.nodeService.port }}"
  NODE_ENV: {{ .Values.nodeService.env.NODE_ENV | quote }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.nodeService.name }}
  namespace: {{ .Values.global.namespace }}
  labels:
    app: {{ .Values.nodeService.name }}
spec:
  replicas: {{ .Values.nodeService.replicas }}
  selector:
    matchLabels:
      app: {{ .Values.nodeService.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.nodeService.name }}
    spec:
      containers:
        - name: {{ .Values.nodeService.name }}
          image: "{{ .Values.global.imageRegistry }}/{{ .Values.nodeService.image }}:{{ .Values.global.imageTag }}"
          imagePullPolicy: {{ .Values.nodeService.pullPolicy }}
          ports:
            - containerPort: {{ .Values.nodeService.port }}
          envFrom:
            - configMapRef:
                name: node-service-config
          resources:
            {{- toYaml .Values.nodeService.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.nodeService.port }}
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.nodeService.port }}
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: node-data
              mountPath: /app/data
      volumes:
        - name: node-data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.nodeService.name }}
  namespace: {{ .Values.global.namespace }}
  labels:
    app: {{ .Values.nodeService.name }}
spec:
  selector:
    app: {{ .Values.nodeService.name }}
  ports:
    - port: {{ .Values.nodeService.port }}
      targetPort: {{ .Values.nodeService.port }}
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ .Values.nodeService.name }}-hpa
  namespace: {{ .Values.global.namespace }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ .Values.nodeService.name }}
  minReplicas: {{ .Values.nodeService.hpa.minReplicas }}
  maxReplicas: {{ .Values.nodeService.hpa.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilizationPercentage: {{ .Values.nodeService.hpa.targetCPUUtilizationPercentage }}
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilizationPercentage: {{ .Values.nodeService.hpa.targetMemoryUtilizationPercentage }}
