name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  AWS_REGION: eu-north-1
  EKS_CLUSTER: urlshortener-fun-cluster
  NAMESPACE: urlshortener

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Test Python service
        run: |
          cd python-service
          pip install -r requirements.txt
          python -m pytest tests/ -v --tb=short 2>/dev/null || echo "No tests found - skipping"

      - name: Test Go service
        run: |
          cd go-service
          go test ./... -v 2>/dev/null || echo "No tests found - skipping"

      - name: Test Node service
        run: |
          cd node-service
          npm install
          npm test 2>/dev/null || echo "No tests found - skipping"

  sonarcloud:
    name: SonarCloud Analysis
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  build-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    needs: sonarcloud
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push Python service
        uses: docker/build-push-action@v5
        with:
          context: ./python-service
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/python-service:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/python-service:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push Go service
        uses: docker/build-push-action@v5
        with:
          context: ./go-service
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/go-service:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/go-service:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push Node service
        uses: docker/build-push-action@v5
        with:
          context: ./node-service
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/node-service:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/node-service:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to EKS
    runs-on: ubuntu-latest
    needs: build-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --region ${{ env.AWS_REGION }} --name ${{ env.EKS_CLUSTER }}

      - name: Install Helm
        uses: azure/setup-helm@v3
        with:
          version: v3.14.0

      - name: Deploy via Helm
        run: |
          helm upgrade --install urlshortener ./helm/urlshortener \
            --namespace ${{ env.NAMESPACE }} \
            --create-namespace \
            --set global.imageRegistry=${{ secrets.DOCKERHUB_USERNAME }} \
            --set global.imageTag=${{ github.sha }} \
            --set ingress.host="" \
            --atomic \
            --timeout 5m \
            --wait

      - name: Verify deployment
        run: |
          kubectl get pods -n ${{ env.NAMESPACE }}
          kubectl get hpa -n ${{ env.NAMESPACE }}
          kubectl get ingress -n ${{ env.NAMESPACE }}
          kubectl get svc -n ingress-nginx
